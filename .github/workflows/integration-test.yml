name: Integration test (Arch + monocoque)

# Closest analogue to a "deploy to integration environment, then test"
# stage: builds the real app once on a fast, ordinary ubuntu-22.04 runner
# (matching release-please.yml's build-release job — same deps, same deb
# bundle), then hands that prebuilt artifact to a disposable Arch Linux
# container (not a self-hosted runner — see the security note in the plan
# this workflow was designed from) which installs `monocoque` from the AUR
# and smoke-tests the built artifact. Also validates the AUR PKGBUILD in
# the same container, since it's the same environment either way.
#
# LIVE-TELEMETRY CHECK TEMPORARILY DISABLED: the smoke test used to assert
# on real telemetry published via monocoque's shared-memory bridge, but
# that capability requires a local, unpublished patch to monocoque's own
# gameloop.c (feature/test-mode-shm-publish in the sibling monocoque repo)
# that hasn't been validated against real hardware or submitted upstream
# yet — the AUR's monocoque package builds from a pinned upstream commit
# without it. Re-enable once that patch is merged/published somewhere this
# workflow's `paru -S monocoque` step can pick it up (see the smoke-test
# script's own comment for specifics). Until then the smoke test only
# checks that the backend starts and answers GraphQL without crashing.
#
# Deliberately NOT building inside the Arch container itself: a cold,
# uncached `cargo build --release` there (this repo's duckdb-adapter alone
# compiles DuckDB's C++ source from scratch) measured ~35 minutes with
# nothing else running — building once on ubuntu-22.04 (which gets real
# actions/cache support via Swatinem/rust-cache, unlike a container job)
# and downloading the result is both faster on repeat runs and decouples
# "does it compile" from "does it work" so a slow build never masquerades
# as this job being stuck. The tradeoff: this duplicates build work
# release-please.yml's own build-release job also does for real releases
# — acceptable for now since consuming that job's actual (draft, possibly
# not-yet-uploaded) release asset directly would add real timing/auth
# complications this workflow doesn't need.
#
# NEW, UNPROVEN INFRASTRUCTURE: unlike the Rust/TS work in this repo's other
# workflows, none of this could be exercised locally while writing it (no
# way to spin up a real Arch container in this environment). Treat the
# first several runs as genuinely experimental. `su builder -c` doesn't
# inherit the runner's working directory or environment, so every step
# below cds into `$GITHUB_WORKSPACE` explicitly and threads through
# anything (like DISPLAY) it needs rather than relying on inheritance; the
# smoke test's own logic lives in a real script file (not an inline
# `su -c "..."` string) specifically to avoid nested-quoting the GraphQL
# JSON payload inside a shell string.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: typiql-tauri/typiql
      - uses: actions/checkout@v4
        with:
          repository: MrDavid5465/typiql-rs
          path: typiql-rs

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file \
            libxdo-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: typiql-tauri/typiql/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: typiql-tauri/typiql/src-tauri -> target

      - working-directory: typiql-tauri/typiql
        run: npm ci

      - name: Build (release + deb bundle)
        working-directory: typiql-tauri/typiql
        run: npm run tauri build -- --bundles deb

      - uses: actions/upload-artifact@v4
        with:
          name: typiql-binary
          path: typiql-tauri/typiql/src-tauri/target/release/typiql
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: typiql-deb
          path: typiql-tauri/typiql/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      # The built `typiql` binary is a real native GTK/webkit2gtk window, not
      # just the embedded axum API — this container has no display server at
      # all, so it panics on startup ("Failed to initialize GTK") before the
      # API ever starts listening. Xvfb (started below) gives it one; DISPLAY
      # is a job-level env var so it's available to every `run:` block's own
      # (root) shell, which substitutes it into the `su builder -c "..."`
      # strings the same way $GITHUB_WORKSPACE already is — su itself doesn't
      # forward environment, so it still has to be threaded through per step.
      DISPLAY: ':99'
    steps:
      - name: Prepare Arch environment
        # `rustup default stable` is per-user (writes to ~/.rustup), and the
        # AUR-helper build below runs as `builder` via `su builder -c`, not
        # root — so builder needs its own default toolchain set explicitly
        # here, once, before paru's makepkg ever runs as that user. Hit this
        # in practice: "rustup could not choose a version of cargo to run,
        # because one wasn't specified explicitly, and no default is
        # configured". Still needed even though the app itself is no longer
        # compiled in this container, since paru (an AUR helper) is a real
        # Rust project built from source.
        run: |
          # portaudio isn't in monocoque's own makedepends (upstream PKGBUILD
          # only lists git+cmake) even though its CMake build unconditionally
          # compiles a bundled pa_devs test tool against portaudio.h — a gap
          # in the third-party AUR package, not ours, worked around here by
          # installing it ourselves before paru ever builds monocoque.
          # xorg-server-xvfb: see the job-level DISPLAY comment above.
          pacman -Syu --noconfirm base-devel git sudo webkit2gtk-4.1 nodejs npm rustup jq portaudio xorg-server-xvfb
          rustup default stable
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          su builder -c 'rustup default stable'

      - name: Start virtual display (Xvfb)
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x720x24 &
          sleep 2

      - uses: actions/checkout@v4
        with:
          path: typiql-tauri/typiql

      - name: Download the built binary
        uses: actions/download-artifact@v4
        with:
          name: typiql-binary
          path: /tmp/typiql-binary

      - name: Download the built .deb (for PKGBUILD validation)
        uses: actions/download-artifact@v4
        with:
          name: typiql-deb
          path: /tmp/typiql-deb

      - name: Stage the downloaded binary where the smoke test expects it
        run: |
          mkdir -p "$GITHUB_WORKSPACE/typiql-tauri/typiql/src-tauri/target/release"
          cp /tmp/typiql-binary/typiql "$GITHUB_WORKSPACE/typiql-tauri/typiql/src-tauri/target/release/typiql"
          chmod +x "$GITHUB_WORKSPACE/typiql-tauri/typiql/src-tauri/target/release/typiql"

      - name: Stage the downloaded .deb where the PKGBUILD expects it
        # Pre-seeding makepkg's local source cache with a file matching the
        # PKGBUILD's own expected filename (derived from its pkgver, not
        # hardcoded here) makes makepkg skip its normal network download —
        # there's no real GitHub Release with this asset yet outside of an
        # actual release cycle, so without this the PKGBUILD validation step
        # would fail trying to fetch one.
        run: |
          cd "$GITHUB_WORKSPACE/typiql-tauri/typiql/pkg/aur"
          pkgver=$(grep -oP '^pkgver=\K.*' PKGBUILD)
          cp /tmp/typiql-deb/*.deb "./typiql_${pkgver}_amd64.deb"

      - name: Hand the checked-out workspace to the non-root build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build an AUR helper (paru) — none ship in the official repos
        # Building from source (not paru-bin) deliberately: paru-bin ships a
        # prebuilt binary linked against whatever libalpm SONAME was current
        # when it was last published, which drifts out of sync with
        # archlinux:latest after `pacman -Syu` fully updates the rolling
        # release — hit exactly this in practice ("paru: error while loading
        # shared libraries: libalpm.so.15: cannot open shared object file").
        # Compiling from source links against whatever's actually installed.
        run: |
          su builder -c '
            set -e
            git clone https://aur.archlinux.org/paru.git /tmp/paru
            cd /tmp/paru
            makepkg -si --noconfirm
          '

      - name: Install monocoque from the AUR
        run: su builder -c 'paru -S --noconfirm monocoque'

      - name: npm ci
        # --allow-git=all: npm v12+ disables fetching git-protocol
        # dependencies by default (EALLOWGIT) as a supply-chain security
        # default — this repo's @octant/per-form dependency is exactly that
        # (a git dependency, deliberately, per per-form's own fork history),
        # so it needs an explicit opt-in here. Still needed here even though
        # the app itself isn't compiled in this container: the Playwright
        # e2e suite below needs node_modules.
        run: su builder -c "cd '$GITHUB_WORKSPACE/typiql-tauri/typiql' && npm ci --allow-git=all"

      - name: Write smoke-test script
        run: |
          cat > /tmp/smoke-test.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -e
          export DISPLAY=:99
          cd "$1/typiql-tauri/typiql/src-tauri"

          ./target/release/typiql &
          app_pid=$!
          sleep 5

          # monocoque test still runs here as a smoke test of the AUR
          # package itself (does the installed binary start without
          # crashing) — but it can't actually publish live telemetry to
          # /dev/shm/SIMAPI.DAT in this environment: that requires a local,
          # unpublished patch to monocoque's gameloop.c
          # (feature/test-mode-shm-publish in the sibling monocoque repo),
          # not yet validated against real hardware or submitted upstream.
          # The AUR package builds from a pinned upstream commit that
          # doesn't have it. DO NOT assert on live telemetry (simStatus,
          # car, rpm, etc.) here until that patch is merged/published
          # somewhere this workflow's `paru -S monocoque` step can pick up
          # — confirmed by waiting a full 10s and finding /dev/shm/
          # completely empty the entire time, not a timing issue.
          monocoque test &
          monocoque_pid=$!
          sleep 2

          # Health check only for now: confirm the backend actually starts
          # and answers a real GraphQL query without crashing — this alone
          # already caught one real bug this session (axum's "nesting at
          # root" panic in a release build). Deliberately not asserting on
          # telemetry content, just that the query round-trips cleanly.
          snapshot=$(curl -sf http://localhost:9000/typiql/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ telemetrySnapshot { simStatus car rpm } }"}')
          echo "$snapshot"
          echo "$snapshot" | jq -e '(.errors | not) and (.data | has("telemetrySnapshot"))'

          kill "$monocoque_pid" "$app_pid" 2>/dev/null || true
          SCRIPT
          chmod +x /tmp/smoke-test.sh

      - name: Smoke test — backend starts and answers GraphQL (live telemetry check disabled, pending unpublished monocoque patch)
        run: su builder -c "/tmp/smoke-test.sh '$GITHUB_WORKSPACE'"

      - name: Playwright e2e suite against the real build
        # playwright.config.ts's webServer runs `npm run dev` (Vite only)
        # and the suite mocks GraphQL (e2e/helpers/mock-gql.ts) — it doesn't
        # touch the downloaded binary at all, just needs node_modules.
        run: |
          su builder -c "
            cd '$GITHUB_WORKSPACE/typiql-tauri/typiql'
            npx playwright install --with-deps chromium
            npm run test:e2e
          "

      - name: Validate AUR PKGBUILD (build + install in this same environment)
        run: |
          su builder -c "
            cd '$GITHUB_WORKSPACE/typiql-tauri/typiql/pkg/aur'
            makepkg --printsrcinfo > .SRCINFO
            makepkg -si --noconfirm
            command -v typiql
          "
