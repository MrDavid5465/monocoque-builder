name: Integration test (Arch + monocoque)

# Closest analogue to a "deploy to integration environment, then test"
# stage: builds the real app inside a disposable Arch Linux container
# (not a self-hosted runner — see the security note in the plan this
# workflow was designed from), installs `monocoque` from the AUR, and
# proves the built artifact actually talks to live telemetry rather than
# just checking that compilation succeeded. Also validates the AUR
# PKGBUILD in the same container, since it's the same environment either
# way.
#
# NEW, UNPROVEN INFRASTRUCTURE: unlike the Rust/TS work in this repo's other
# workflows, none of this could be exercised locally while writing it (no
# way to spin up a real Arch container in this environment). Treat the
# first several runs as genuinely experimental and expect to iterate on
# exact package names, the AUR-helper bootstrap, and the smoke-test
# timing/ports below. `su builder -c` doesn't inherit the runner's working
# directory, so every step below cds into `$GITHUB_WORKSPACE` explicitly
# rather than relying on relative paths; the smoke test's own logic lives
# in a real script file (not an inline `su -c "..."` string) specifically
# to avoid nested-quoting the GraphQL JSON payload inside a shell string.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    env:
      # The built `typiql` binary is a real native GTK/webkit2gtk window, not
      # just the embedded axum API — this container has no display server at
      # all, so it panics on startup ("Failed to initialize GTK") before the
      # API ever starts listening. Xvfb (started below) gives it one; DISPLAY
      # is a job-level env var so it's available to every `run:` block's own
      # (root) shell, which substitutes it into the `su builder -c "..."`
      # strings the same way $GITHUB_WORKSPACE already is — su itself doesn't
      # forward environment, so it still has to be threaded through per step.
      DISPLAY: ':99'
    steps:
      - name: Prepare Arch environment
        # `rustup default stable` is per-user (writes to ~/.rustup), and every
        # build step below runs as `builder` via `su builder -c`, not root —
        # so builder needs its own default toolchain set explicitly here,
        # once, before makepkg/cargo ever runs as that user. Hit this in
        # practice: "rustup could not choose a version of cargo to run,
        # because one wasn't specified explicitly, and no default is
        # configured" from paru's build() step.
        run: |
          # portaudio isn't in monocoque's own makedepends (upstream PKGBUILD
          # only lists git+cmake) even though its CMake build unconditionally
          # compiles a bundled pa_devs test tool against portaudio.h — a gap
          # in the third-party AUR package, not ours, worked around here by
          # installing it ourselves before paru ever builds monocoque.
          # xorg-server-xvfb: see the job-level DISPLAY comment above.
          pacman -Syu --noconfirm base-devel git sudo webkit2gtk-4.1 nodejs npm rustup jq portaudio xorg-server-xvfb
          rustup default stable
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          su builder -c 'rustup default stable'

      - name: Start virtual display (Xvfb)
        run: |
          Xvfb "$DISPLAY" -screen 0 1280x720x24 &
          sleep 2

      - uses: actions/checkout@v4
        with:
          path: typiql-tauri/typiql
      - uses: actions/checkout@v4
        with:
          repository: MrDavid5465/typiql-rs
          path: typiql-rs

      - name: Hand the checked-out workspace to the non-root build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build an AUR helper (paru) — none ship in the official repos
        # Building from source (not paru-bin) deliberately: paru-bin ships a
        # prebuilt binary linked against whatever libalpm SONAME was current
        # when it was last published, which drifts out of sync with
        # archlinux:latest after `pacman -Syu` fully updates the rolling
        # release — hit exactly this in practice ("paru: error while loading
        # shared libraries: libalpm.so.15: cannot open shared object file").
        # Compiling from source links against whatever's actually installed.
        run: |
          su builder -c '
            set -e
            git clone https://aur.archlinux.org/paru.git /tmp/paru
            cd /tmp/paru
            makepkg -si --noconfirm
          '

      - name: Install monocoque from the AUR
        run: su builder -c 'paru -S --noconfirm monocoque'

      - name: npm ci
        # --allow-git=all: npm v12+ disables fetching git-protocol
        # dependencies by default (EALLOWGIT) as a supply-chain security
        # default — this repo's @octant/per-form dependency is exactly that
        # (a git dependency, deliberately, per per-form's own fork history),
        # so it needs an explicit opt-in here.
        run: su builder -c "cd '$GITHUB_WORKSPACE/typiql-tauri/typiql' && npm ci --allow-git=all"

      - name: cargo build (release, so the smoke test drives a real binary)
        run: su builder -c "cd '$GITHUB_WORKSPACE/typiql-tauri/typiql/src-tauri' && cargo build --release"

      - name: Write smoke-test script
        run: |
          cat > /tmp/smoke-test.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -e
          export DISPLAY=:99
          cd "$1/typiql-tauri/typiql/src-tauri"

          ./target/release/typiql &
          app_pid=$!
          sleep 5

          monocoque test &
          monocoque_pid=$!
          sleep 3

          snapshot=$(curl -sf http://localhost:9000/typiql/graphql \
            -H "Content-Type: application/json" \
            -d '{"query":"{ telemetrySnapshot { simStatus car rpm } }"}')
          echo "$snapshot"
          echo "$snapshot" | jq -e '.data.telemetrySnapshot.simStatus == "ACTIVE"'

          kill "$monocoque_pid" "$app_pid" 2>/dev/null || true
          SCRIPT
          chmod +x /tmp/smoke-test.sh

      - name: Smoke test — real telemetry through the real built backend
        run: su builder -c "/tmp/smoke-test.sh '$GITHUB_WORKSPACE'"

      - name: Playwright e2e suite against the real build
        run: |
          su builder -c "
            cd '$GITHUB_WORKSPACE/typiql-tauri/typiql'
            npx playwright install --with-deps chromium
            npm run test:e2e
          "

      - name: Validate AUR PKGBUILD (build + install in this same environment)
        run: |
          su builder -c "
            cd '$GITHUB_WORKSPACE/typiql-tauri/typiql/pkg/aur'
            makepkg --printsrcinfo > .SRCINFO
            makepkg -si --noconfirm
            command -v typiql
          "
