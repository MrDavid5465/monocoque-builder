name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monocoque-builder
    steps:
      - uses: actions/checkout@v4
        with:
          path: monocoque-builder
          # per-form and typical-admin-fabric are git submodules, so without
          # this their paths arrive empty and both tsc and eslint fail with
          # TS2307 "Cannot find module '../per-form'". The flatpak manifest
          # solves the same problem differently (pinned git sources) because
          # a real .git file there collides with flatpak-builder's own git
          # source -- that constraint doesn't apply to a plain checkout.
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: monocoque-builder/package-lock.json

      - run: npm ci
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npm test

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: monocoque-builder
      - uses: actions/checkout@v4
        with:
          repository: MrDavid5465/typiql-rs
          path: typiql-rs

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf build-essential curl wget file \
            libxdo-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: monocoque-builder/src-tauri -> target

      # tauri::generate_context! embeds the frontend bundle whenever
      # custom-protocol is enabled, and --all-features below enables it, so the
      # macro refuses to expand unless frontendDist ("../dist") exists:
      #
      #   error: proc macro panicked
      #     help: message: The `frontendDist` configuration is set to `"../dist"`
      #           but this path doesn't exist
      #
      # This job lints and tests Rust. Producing the real bundle would mean
      # adding node, the two frontend submodules and a vite run for no extra
      # coverage, so a placeholder satisfies the macro instead. The frontend is
      # built for real in the build job and in every packaging workflow.
      - name: Placeholder frontend bundle for generate_context!
        working-directory: monocoque-builder
        run: |
          mkdir -p dist
          printf '<!doctype html><title>ci placeholder</title>' > dist/index.html

      - name: cargo fmt --check
        working-directory: monocoque-builder/src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: monocoque-builder/src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        working-directory: monocoque-builder/src-tauri
        run: cargo test --all-features
