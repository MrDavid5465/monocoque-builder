name: Publish to AUR

# Deliberately workflow_dispatch-only, never automatic — the plan's "nothing
# publishes live until you've dry-run it and are satisfied" requirement
# applies here too. integration-test.yml already validates that the
# PKGBUILD in pkg/aur/ builds and installs cleanly in a real Arch
# container; this workflow just pushes that same PKGBUILD (with a real
# pkgver + sha256sum filled in) to the real AUR, and only when triggered
# by hand. Runs in an Arch container (same pattern as integration-test.yml)
# so `makepkg --printsrcinfo` can run for real rather than being faked
# with a second tool — makepkg refuses to run as root even for this, so
# it needs the same non-root builder-user setup.
#
# Needs AUR_SSH_PRIVATE_KEY (already set as a repo secret): the private
# half of an SSH key registered under aur.archlinux.org -> My Account ->
# SSH Public Key.
on:
  workflow_dispatch:
    inputs:
      pkgver:
        description: 'Version to publish (must match a real GitHub Release tag, e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Prepare Arch environment
        run: |
          pacman -Syu --noconfirm base-devel git openssh
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4
        with:
          path: typiql-tauri/typiql

      - name: Set pkgver and real sha256sum against the release .deb
        working-directory: typiql-tauri/typiql/pkg/aur
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
          # release-please tags releases as {package-name}-v{version}
          # (telemetry-admin-v0.1.1), not the plain v{version} this used to
          # assume — confirmed against the real v0.1.1 release, which 404'd
          # under the old URL.
          curl -fsSL -o typiql.deb \
            "https://github.com/MrDavid5465/telemetry-admin/releases/download/telemetry-admin-v${{ inputs.pkgver }}/typiql_${{ inputs.pkgver }}_amd64.deb"
          sum=$(sha256sum typiql.deb | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${sum}')/" PKGBUILD
          rm typiql.deb

      - name: Hand the workspace to the non-root build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate .SRCINFO
        working-directory: typiql-tauri/typiql/pkg/aur
        run: su builder -c "cd '$GITHUB_WORKSPACE/typiql-tauri/typiql/pkg/aur' && makepkg --printsrcinfo > .SRCINFO"

      - name: Set up SSH for the AUR
        # ssh-keyscan pre-seeding known_hosts turned out unreliable here
        # (confirmed by a real run: key present and valid, but git's SSH
        # transport still reported "Host key verification failed") —
        # accept-new is the standard low-risk substitute for a scripted CI
        # connection to one well-known host: it still verifies and pins the
        # key on first connect within this run, just without the separate
        # keyscan step that wasn't actually landing a usable entry.
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          cat > ~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur
            User aur
            StrictHostKeyChecking accept-new
          EOF
          chmod 600 ~/.ssh/config

      # TEMPORARY diagnostic: accept-new should have made the previous
      # "Host key verification failed" impossible, but it recurred anyway
      # on a real run with this exact config present — dump the real SSH
      # handshake instead of guessing at a third fix blind. `ssh -T` to a
      # git-only AUR account always exits non-zero (no shell access), so
      # `|| true` just lets us see the verbose output without failing the
      # step early.
      - name: Diagnose SSH handshake
        run: ssh -vvv -o StrictHostKeyChecking=accept-new -i ~/.ssh/aur aur@aur.archlinux.org 2>&1 || true

      - name: Push PKGBUILD to the AUR
        run: |
          git clone ssh://aur@aur.archlinux.org/telemetry-admin.git /tmp/aur-telemetry-admin
          cp typiql-tauri/typiql/pkg/aur/PKGBUILD typiql-tauri/typiql/pkg/aur/.SRCINFO /tmp/aur-telemetry-admin/
          cd /tmp/aur-telemetry-admin
          git config user.name "David Scott"
          git config user.email "david@davidallanscott.ca"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ inputs.pkgver }}"
          git push
