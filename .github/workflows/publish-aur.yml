name: Publish to AUR

# Deliberately workflow_dispatch-only, never automatic — the plan's "nothing
# publishes live until you've dry-run it and are satisfied" requirement
# applies here too. integration-test.yml already validates that the
# PKGBUILD in pkg/aur/ builds and installs cleanly in a real Arch
# container; this workflow just pushes that same PKGBUILD (with a real
# pkgver + sha256sum filled in) to the real AUR, and only when triggered
# by hand. Runs in an Arch container (same pattern as integration-test.yml)
# so `makepkg --printsrcinfo` can run for real rather than being faked
# with a second tool — makepkg refuses to run as root even for this, so
# it needs the same non-root builder-user setup.
#
# Needs AUR_SSH_PRIVATE_KEY (already set as a repo secret): the private
# half of an SSH key registered under aur.archlinux.org -> My Account ->
# SSH Public Key.
on:
  workflow_dispatch:
    inputs:
      pkgver:
        description: 'Version to publish (must match a real GitHub Release tag, e.g. 0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish-aur:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Prepare Arch environment
        run: |
          pacman -Syu --noconfirm base-devel git openssh
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder

      - uses: actions/checkout@v4
        with:
          path: monocoque-builder

      - name: Set pkgver and real sha256sum against the release .deb
        working-directory: monocoque-builder/pkg/aur
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ inputs.pkgver }}/" PKGBUILD
          # release-please tags releases as {package-name}-v{version}
          # (telemetry-admin-v0.1.1), not the plain v{version} this used to
          # assume — confirmed against the real v0.1.1 release, which 404'd
          # under the old URL.
          curl -fsSL -o monocoque-builder.deb \
            "https://github.com/MrDavid5465/monocoque-builder/releases/download/monocoque-builder-v${{ inputs.pkgver }}/monocoque-builder_${{ inputs.pkgver }}_amd64.deb"
          sum=$(sha256sum monocoque-builder.deb | cut -d' ' -f1)
          sed -i "s/^sha256sums=.*/sha256sums=('${sum}')/" PKGBUILD
          rm monocoque-builder.deb

      - name: Hand the workspace to the non-root build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Generate .SRCINFO
        working-directory: monocoque-builder/pkg/aur
        run: su builder -c "cd '$GITHUB_WORKSPACE/monocoque-builder/pkg/aur' && makepkg --printsrcinfo > .SRCINFO"

      - name: Set up SSH for the AUR
        # Two real runs' worth of ssh -vvv output showed the actual root
        # cause: this container's $HOME env var (/github/home) is what the
        # shell uses to expand `~`, but plain `ssh`/git-over-ssh with no
        # explicit flags looks up its default config/identity/known_hosts
        # via the passwd-database home for the running user (root ->
        # /root) instead, completely ignoring $HOME. Writing to `~/.ssh/`
        # and relying on ~/.ssh/config's Host-block matching therefore
        # silently wrote files ssh's own default lookup never saw — no
        # IdentityFile found -> "Permission denied (publickey)" even
        # though the key itself is valid and correctly registered
        # (confirmed: an explicit `-i $HOME/.ssh/aur` connection succeeds
        # and gets AUR's real welcome banner). Fix: don't rely on ssh's
        # default path discovery at all — point git at the key directly
        # via GIT_SSH_COMMAND, built from $HOME so it matches wherever
        # this same script actually wrote the file.
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          echo "${{ secrets.AUR_SSH_PRIVATE_KEY }}" > "$HOME/.ssh/aur"
          chmod 600 "$HOME/.ssh/aur"
          echo "GIT_SSH_COMMAND=ssh -i $HOME/.ssh/aur -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=$HOME/.ssh/known_hosts" >> "$GITHUB_ENV"

      - name: Push PKGBUILD to the AUR
        run: |
          git clone ssh://aur@aur.archlinux.org/monocoque-builder.git /tmp/aur-monocoque-builder
          cp monocoque-builder/pkg/aur/PKGBUILD monocoque-builder/pkg/aur/.SRCINFO /tmp/aur-monocoque-builder/
          cd /tmp/aur-monocoque-builder
          git config user.name "David Scott"
          git config user.email "david@davidallanscott.ca"
          # AUR only accepts pushes to a branch literally named master —
          # not guaranteed to be this container git's default init branch.
          git branch -M master
          git add PKGBUILD .SRCINFO
          git commit -m "Update to ${{ inputs.pkgver }}"
          git push -u origin master
