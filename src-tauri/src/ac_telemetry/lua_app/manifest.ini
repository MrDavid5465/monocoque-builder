[ABOUT]
NAME = TyPiQL Telemetry
AUTHOR = TyPiQL
VERSION = 1.0.0
DESCRIPTION = Streams in-game time, lighting, cockpit camera and position to TyPiQL during normal play. Read-only; changes nothing about the session.

[CORE]
; Loads with the game and runs until it closes. This has to be streaming from
; the moment a session starts, and nobody is going to open a window first.
LAZY = NONE

[WINDOW_...]
ID = typiql_telemetry
NAME = TyPiQL Telemetry
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 300, 140
FLAGS = AUTO_RESIZE
