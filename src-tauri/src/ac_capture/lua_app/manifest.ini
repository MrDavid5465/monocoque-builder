[ABOUT]
NAME = TyPiQL 360° Capture
AUTHOR = TyPiQL
VERSION = 1.0.0
DESCRIPTION = Captures day/night 360° cockpit reference photos on request from TyPiQL. Idle unless TyPiQL has queued a job.

[CORE]
; NONE = load the script while AC is loading and keep it running until AC
; closes (CSP's documented default). The capture has to drive the session
; from the moment it starts — before any window could be opened by hand —
; so lazy loading is not an option here.
LAZY = NONE

; A window isn't required for LAZY=NONE to run the script, but having one
; costs nothing and gives somewhere to read the state machine's status from
; while verifying a capture on the rig. It is never opened automatically,
; and ac.setAppsHidden(true) hides it along with every other app before any
; screenshot is taken.
; The in-game UI callback runs while the pre-drive screen is still up, which
; `script.update` appears not to — so this is what gets a chance to start the
; session before anyone has pressed anything. CSP's own bundled apps use the
; same hook for the race countdown, and check `isInMainMenu` inside it, which
; is how we know it fires in menus.
[UI_CALLBACKS]
IN_GAME = inGameUI

; ICON is what gets the app listed in AC's app drawer. Without it the script
; still autoruns, but there's no way to open the window and watch which state
; a capture reached — which is the only view into a run that goes wrong.
[WINDOW_...]
ID = typiql_360_capture
NAME = TyPiQL 360° Capture
ICON = icon.png
FUNCTION_MAIN = windowMain
SIZE = 320, 180
FLAGS = AUTO_RESIZE
