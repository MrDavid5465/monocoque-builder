[workspace]
members = [
    ".",
]

[package]
name = "monocoque-builder"
version = "0.4.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "monocoque_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0.0"
regex = "1.12.3"
axum = "0.8.9"
tokio = "1.52.3"
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors", "fs"] }
tokio-stream = "0.1.18"
futures-util = "0.3.32"
http = "1.4.2"
memmap2 = "0.9.10"
dns-lookup = "3.0.1"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
typiql = { path = "../../typiql-rs/crates/typiql-core", package = "typiql-core" }
typiql-adapter-json = { path = "../../typiql-rs/crates/typiql-adapter-json" }
typiql-adapter-duckdb = { path = "../../typiql-rs/crates/typiql-adapter-duckdb", default-features = false }
evdev = "0.12"
nusb = "0.2.7"

[features]
# Opt-in, not shipped: `cargo build --features devtools` enables the WebKit
# inspector in a release build. Left off by default because on this hardware
# opening it wedges the render process and then crashes the window to a blank
# grey -- the same NVIDIA/WebKitGTK territory as WEBKIT_DISABLE_DMABUF_RENDERER
# in the Flatpak manifest.
devtools = ["tauri/devtools"]
# Without this the build is a *dev* build as far as Tauri is concerned -- its
# build script literally does `let dev = !custom_protocol` -- so the window
# loads devUrl (http://localhost:1420) instead of the embedded frontend, and
# shows "Could not connect to localhost: Connection refused" with nothing
# listening there. `tauri build` passes this feature itself; builds that call
# cargo directly, as the Flatpak manifest does, have to ask for it.
custom-protocol = ["tauri/custom-protocol"]
# On by default so `cargo build` and the deb/rpm/AppImage builds keep
# compiling DuckDB from source exactly as before. The Flatpak build passes
# --no-default-features and supplies a prebuilt libduckdb instead, which cuts
# that build from ~42 minutes to ~6. See the adapter crate's own [features]
# for the version-matching constraint.
default = ["duckdb-bundled", "custom-protocol"]
duckdb-bundled = ["typiql-adapter-duckdb/bundled"]
