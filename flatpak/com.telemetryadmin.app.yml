# Best-effort Flatpak manifest — NOT submitted anywhere (Flathub or
# otherwise), built in CI purely so a .flatpak bundle exists as a release
# asset. This is the least-verified part of the whole CI/CD setup: nothing
# here has been exercised against a real flatpak-builder run yet (no way to
# do that in this environment). Treat the first several CI runs as
# genuinely experimental.
#
# Builds via `cargo build --release` + a plain Vite build directly, not
# through Tauri's own bundler — the bundler's .deb/AppImage/rpm targets
# invoke external packaging tools (dpkg-deb, linuxdeploy, appimagetool)
# that don't belong in a Flatpak sandbox and aren't needed here. Flatpak
# just wants the raw binary, an icon, a .desktop file, and a metainfo.xml,
# which this manifest supplies by hand (com.telemetryadmin.app.desktop /
# .metainfo.xml, alongside this file).
#
# org.gnome.Platform, not org.freedesktop.Platform: WebKitGTK (which this
# app's webview depends on) ships as part of the GNOME runtime, not the
# bare freedesktop one.
app-id: com.telemetryadmin.app
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node20
command: typiql
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --filesystem=xdg-config/dashboard-designer:create
  - --filesystem=xdg-data/dashboard-designer:create

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node20/bin
  env:
    CARGO_HOME: /run/build/typiql/cargo

modules:
  - name: typiql
    buildsystem: simple
    sources:
      # Populated at CI-generation time from the two sibling checkouts
      # (typiql-tauri/typiql + typiql-rs) via flatpak-node-generator and
      # flatpak-cargo-generator.py, run against src-tauri/Cargo.lock and
      # package-lock.json. Path deps in Cargo.lock (the ../../../typiql-rs
      # crates) resolve locally and need no generated source entries;
      # only registry/git deps do.
      - type: dir
        path: ../..
        dest: src
      - generated-node-sources.json
      - generated-cargo-sources.json
      - type: file
        path: com.telemetryadmin.app.desktop
      - type: file
        path: com.telemetryadmin.app.metainfo.xml
    build-commands:
      - cd src/typiql-tauri/typiql && npm ci --offline
      - cd src/typiql-tauri/typiql && npm run build
      - cd src/typiql-tauri/typiql/src-tauri && cargo build --release --offline --locked
      - install -Dm755 src/typiql-tauri/typiql/src-tauri/target/release/typiql /app/bin/typiql
      - install -Dm644 com.telemetryadmin.app.desktop /app/share/applications/com.telemetryadmin.app.desktop
      - install -Dm644 com.telemetryadmin.app.metainfo.xml /app/share/metainfo/com.telemetryadmin.app.metainfo.xml
      - install -Dm644 src/typiql-tauri/typiql/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/com.telemetryadmin.app.png
      - install -Dm644 src/typiql-tauri/typiql/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/com.telemetryadmin.app.png
